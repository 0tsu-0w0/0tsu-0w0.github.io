# main への push で GitHub Pages へ公開する。
# リポジトリの Settings > Pages で Source を「GitHub Actions」にしておく必要がある
# （下の configure-pages が自動で有効化を試みるが、失敗する場合は手動で設定する）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 「Actions」タブから手動でも実行できるようにする
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に 1 つだけ。実行中のものは中断せず、順番に処理する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: ビルド
        run: npm run build

      - name: Pages の設定を読み込む
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: dist をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
